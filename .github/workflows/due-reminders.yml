name: Lexora due reminders

on:
  schedule:
    # 03:17 America/Argentina/Buenos_Aires = 06:17 UTC.
    # Minuto 17, no en punto: GitHub encola menos los cron que no caen en :00.
    # El margen es para que un atraso de unas horas siga llegando de mañana.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar API y enviar avisos
        env:
          API_URL: ${{ secrets.LEXORA_API_URL }}
          CRON_SECRET: ${{ secrets.LEXORA_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Faltan secrets LEXORA_API_URL o LEXORA_CRON_SECRET"
            exit 1
          fi
          BASE="${API_URL%/}"
          # Despierta Render (cold start)
          echo "Despertando API..."
          curl -fsS --retry 8 --retry-all-errors --retry-delay 15 --max-time 30 \
            "$BASE/" >/dev/null || true
          sleep 5
          echo "Ejecutando cron de vencimientos..."
          RESPONSE=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 20 --max-time 120 \
            -X POST "$BASE/api/kanban/reminders/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "x-cron-trigger: github-actions")
          echo "Respuesta del servidor:"
          echo "$RESPONSE"
          echo "Cron de vencimientos OK"
